apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-localmodel-controller-manager
  namespace: kserve
spec:
  template:
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
      # Change the value of image field below to your controller image URL
      - image: kserve/kserve-localmodel-controller:latest
        name: manager
