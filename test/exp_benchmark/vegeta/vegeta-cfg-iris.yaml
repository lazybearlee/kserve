apiVersion: v1
kind: ConfigMap
metadata:
  name: vegeta-cfg-iris # Give it a unique name maybe per scenario
data:
  # --- CHANGE URL for each scenario ---
  # target-baseline: POST http://sklearn-iris-baseline.kserve-test.example.com/v1/models/sklearn-iris-baseline:predict
  # target-static: POST http://sklearn-iris-static-batch.kserve-test.example.com/v1/models/sklearn-iris-static-batch:predict
  # target-adaptive: POST http://sklearn-iris-adaptive-batch.kserve-test.example.com/v1/models/sklearn-iris-adaptive-batch:predict
  target-cache: POST http://sklearn-iris-cache.kserve-test.example.com/v1/models/sklearn-iris-cache:predict # Example for cache test

  # Use one target configmap and change the target URL within the job YAML? Or create multiple CMs?
  # Let's use one CM and specify target in Job args for simplicity.
  # Define different target configurations here:
  cfg-baseline: |
    POST http://sklearn-iris-baseline.kserve-test.example.com/v1/models/sklearn-iris-baseline:predict
    @/var/vegeta/payload
  cfg-static: |
    POST http://sklearn-iris-static-batch.kserve-test.example.com/v1/models/sklearn-iris-static-batch:predict
    @/var/vegeta/payload
  cfg-adaptive: |
    POST http://sklearn-iris-adaptive-batch.kserve-test.example.com/v1/models/sklearn-iris-adaptive-batch:predict
    @/var/vegeta/payload
  cfg-cache: |
    POST http://sklearn-iris-cache.kserve-test.example.com/v1/models/sklearn-iris-cache:predict
    @/var/vegeta/payload

  # Common Payload
  payload: |
    {
      "instances": [
        [6.8,  2.8,  4.8,  1.4],
        [6.0,  3.4,  4.5,  1.6],
        [5.8,  2.7,  5.1,  1.9],
        [5.4,  3.0,  4.5,  1.5]
      ]
    }